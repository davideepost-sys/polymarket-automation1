name: Lookup Single Trader

on:
  workflow_dispatch:
    inputs:
      trader:
        description: 'Username, wallet-adress eller Polymarket-profillänk'
        required: true
        type: string
      search_depth:
        description: 'Max antal stängda positioner att läsa'
        required: false
        default: '2000'
        type: string

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip

      - name: Look up exact trader and send result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 lookup_trader.py \
            "${{ inputs.trader }}" \
            --search-depth "${{ inputs.search_depth }}"
