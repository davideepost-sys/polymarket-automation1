name: Lookup Single Trader

on:

  workflow_dispatch:

    inputs:

      trader:

        description: 'Username eller wallet-adress (0x...)'

        required: true

        type: string

      search_depth:

        description: 'Hur långt ner i veckans topplista ska vi leta (max 10000)'

        required: false

        default: '2000'

        type: string

jobs:

  lookup:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

      - name: Install dependencies

        run: |

          python3 -m pip install --upgrade pip

      - name: Look up trader

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python3 lookup_trader.py "${{ github.event.inputs.trader }}" "${{ github.event.inputs.search_depth || '2000' }}"
