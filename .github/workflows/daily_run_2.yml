name: Daily Polymarket Analyzer Variant 2

on:
  workflow_dispatch:
    inputs:
      pool_size:
        description: 'Number of top traders to analyze (default: 500)'
        required: false
        default: '500'
        type: string
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip

      - name: Run Polymarket Analyzer
        run: |
          python3 scraper_2.py ${{ github.event.inputs.pool_size || '500' }}

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-traders-${{ github.run_number }}
          path: traders_*.csv
          retention-days: 30
          if-no-files-found: error

      - name: Save latest CSV to repo
        run: |
          LATEST=$(ls -t traders_*.csv | head -n 1)
          cp "$LATEST" latest_traders.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_traders.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update latest_traders.csv ($LATEST)"
          git push

      - name: Generate AI Summary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 -c "import ai_analyst; print(ai_analyst.analyze_latest_traders_for_digest())" > ai_summary.txt

      - name: Send daily Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 send_digest.py
